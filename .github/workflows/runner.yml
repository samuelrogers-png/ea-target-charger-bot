name: EA Target Charger Update

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes automatically
  workflow_dispatch:         # Allows manual trigger under Actions tab

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper

      - name: Run Scraper
        env:
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
        run: |
          python scraper.py
          
